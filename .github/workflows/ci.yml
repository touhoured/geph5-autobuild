name: CI

on:
  push:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: geph-official/geph5
  UPSTREAM_BRANCH: master

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Synchronize branch and tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --tags --force --prune

          git checkout master
          git reset --hard "upstream/${UPSTREAM_BRANCH}"
          git push origin master --force

          # Mirror tags, including deleting tags removed upstream.
          git fetch upstream --tags --force --prune --prune-tags
          git push origin --tags --force

  common:
    name: Prepare release
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.metadata.outputs.hash }}
      short: ${{ steps.metadata.outputs.short }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          fetch-depth: 0

      - name: Read source metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          hash="$(git rev-parse HEAD)"
          short="$(git rev-parse --short HEAD)"
          tag_name="$(git describe --tags --abbrev=0 --match 'geph5-client-*')"
          # Keep the version format used by the official packaging scripts:
          # VERSION is the git tag with the leading v removed.
          version="${tag_name#geph5-client-}"
          version="${version#v}"

          {
            echo "hash=$hash"
            echo "short=$short"
            echo "tag_name=$tag_name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Recreate daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete daily --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create daily \
            --repo "${{ github.repository }}" \
            --generate-notes --prerelease --target "${{ steps.metadata.outputs.hash }}"

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.metadata.outputs.tag_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.metadata.outputs.tag_name }}" \
              --repo "${{ github.repository }}" \
              --generate-notes --target "${{ steps.metadata.outputs.hash }}"

  build:
    name: Build ${{ matrix.target }}
    needs: common
    runs-on: ${{ matrix.os }}
    env:
      hash: ${{ needs.common.outputs.hash }}
      short: ${{ needs.common.outputs.short }}
      tag_name: ${{ needs.common.outputs.tag_name }}
      version: ${{ needs.common.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            os: windows-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          fetch-depth: 0

      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install Cross
        if: runner.os == 'Linux'
        shell: bash
        run: cargo install cross --locked

      # Match gephgui-pkg/build-windows.bash: build the manager and engine
      # together, and enable the aws_lambda feature required by the client.
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build --locked --release \
              --target "${{ matrix.target }}" \
              -p geph5-app -p geph5-client \
              --features geph5-client/aws_lambda
          else
            cross build --locked --release \
              --target "${{ matrix.target }}" \
              -p geph5-app -p geph5-client \
              --features geph5-client/aws_lambda
          fi

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          output="target/${{ matrix.target }}/release"
          mkdir -p packaged
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "packaged/geph5-${{ matrix.target }}-${version}.zip" \
              "$output/geph5.exe" "$output/geph5-client.exe"
          else
            tar -czf "packaged/geph5-${{ matrix.target }}-${version}.tar.gz" \
              -C "$output" geph5 geph5-client
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geph5-${{ matrix.target }}
          path: packaged/*

      - name: Upload daily release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload daily --repo "${{ github.repository }}" packaged/* --clobber

      - name: Upload versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${tag_name}" --repo "${{ github.repository }}" packaged/* --clobber
